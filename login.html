
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | KUJ Lost & Found</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <h1>KUJ Lost & Found</h1>
    <img src="kuj.png" alt="KUJ Logo" width="50">
    <p>Kampala University - Jinja Campus</p>

    <nav>
        <a href="index.html">Home</a>
        <a href="search.html">Search Items</a>
        <a href="login.html">Admin Login</a>
    </nav>
</header>

<main class="login-container">

    <div class="login-box">

        <h2>Administrator Login</h2>

        <p>Sign in to access the management dashboard.</p>

        <form id="loginForm">

            <label>Email Address</label>
            <input type="email" id="adminEmail" required>

            <label>Password</label>
            <input type="password" id="adminPassword" required>

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginResult"></p>

        <a href="index.html" class="back-link">
            Back to Home
        </a>

    </div>

</main>

<footer>
    <p>&copy; 2026 KU Lost & Found Management System</p>
    <p>Kampala University - Jinja Campus</p>
</footer>

<script type="module" src="script.js"></script>

</body>
</html>
