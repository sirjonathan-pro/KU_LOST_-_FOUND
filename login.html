
<!DOCTYPE html>

<body>

<header>
    <h1>KUJ Lost & Found</h1>
  <img src ="kuj.png"
        alt="kuj.png"
        width="50">
    <p>Kampala University - Jinja Campus</p>

    <nav>
        <a href="index.html">Home</a>
        <a href="search.html">Search Items</a>
        <a href="login.html">Admin Login</a>
    </nav>

  <button id="logoutBtn" type="button">
    Logout
  </button>
</header>

<main class="login-container">

    <div class="login-box">

        <h2>Administrator Login</h2>

        <p>Sign in to access the management dashboard.</p>

        <form id="loginForm">

            <label for="adminEmail">Email Address</label>
            <input
                type="email"
                id="adminEmail"
                placeholder="Enter admin email"
                required
            >

            <label for="adminPassword">Password</label>
            <input
                type="password"
                id="adminPassword"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>

            <p id="loginResult"></p>

        </form>

        <a href="inde.html" class="back-link">
            Back to Home
        </a>

    </div>
<p id="adminMessage"></p>
</main>
